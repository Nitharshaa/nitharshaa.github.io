<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box {
            height: 100px;
            width: 100px;
            background-color: black;
            color: white;
            font-size: 32px;
            display: flex;
            text-align: center;
            justify-content: center;
            align-items: center;
        }
        .container{
            display: grid;
            gap: 1rem;
            /* grid-template-columns: 100px 100px 100px; */
            grid-template-columns: repeat(3, 100px);
            /* grid-template-columns: 33% 33% 33%; */
            /* flex-direction: column; */
            /* grid-template-rows: 100px 100px 100px; */
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="box">
            1
        </div>
        <div class="box">
            2
        </div>
        <div class="box">
            3
        </div>
        <div class="box">
            4
        </div>
        <div class="box">
            5
        </div>
        <div class="box">
            6
        </div>
        <div class="box">
            7
        </div>
        <div class="box">
            8
        </div>
        <div class="box">
            9
        </div>
    </div>
</body>

</html>
